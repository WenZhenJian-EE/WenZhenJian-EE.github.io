<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <rect x="1" y="1" width="858" height="358" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Type III Op-Amp Schematic -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#0f172a">(a) Type III 双零三极模拟补偿网络</text>
  <line x1="425" y1="20" x2="425" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Input node Vout -->
  <circle cx="38" cy="182" r="4" fill="#2563eb"/>
  <text x="38" y="168" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">Vout</text>
  <line x1="42" y1="182" x2="62" y2="182" stroke="#0f172a" stroke-width="2"/>
  <circle cx="62" cy="182" r="3" fill="#0f172a"/>

  <!-- Lower branch: R1 -->
  <line x1="62" y1="182" x2="90" y2="182" stroke="#0f172a" stroke-width="2"/>
  <rect x="90" y="172" width="44" height="20" rx="3" fill="#eff6ff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="112" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">R1</text>
  <line x1="134" y1="182" x2="215" y2="182" stroke="#0f172a" stroke-width="2"/>

  <!-- Upper parallel branch: R3 + C3 -->
  <line x1="62" y1="182" x2="62" y2="132" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="62" y1="132" x2="80" y2="132" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="80" y="122" width="38" height="20" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="99" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">R3</text>
  <line x1="118" y1="132" x2="140" y2="132" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="140" y1="120" x2="140" y2="144" stroke="#059669" stroke-width="2.4"/>
  <line x1="148" y1="120" x2="148" y2="144" stroke="#059669" stroke-width="2.4"/>
  <text x="144" y="114" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">C3</text>
  <line x1="148" y1="132" x2="176" y2="132" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="176" y1="132" x2="176" y2="182" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="176" cy="182" r="3" fill="#0f172a"/>

  <!-- Feedback Network above Op-Amp (Node 195 -> Node 362) -->
  <circle cx="195" cy="182" r="3" fill="#0f172a"/>
  <line x1="195" y1="182" x2="195" y2="74" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="195" y1="74" x2="265" y2="74" stroke="#0f172a" stroke-width="1.8"/>
  <!-- C1 top branch -->
  <line x1="265" y1="62" x2="265" y2="86" stroke="#d97706" stroke-width="2.4"/>
  <line x1="274" y1="62" x2="274" y2="86" stroke="#d97706" stroke-width="2.4"/>
  <text x="270" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">C1</text>
  <line x1="274" y1="74" x2="362" y2="74" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="362" y1="74" x2="362" y2="202" stroke="#0f172a" stroke-width="1.8"/>

  <!-- R2 + C2 middle feedback branch -->
  <circle cx="195" cy="122" r="3" fill="#0f172a"/>
  <line x1="195" y1="122" x2="225" y2="122" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="225" y="112" width="42" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="246" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">R2</text>
  <line x1="267" y1="122" x2="294" y2="122" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="294" y1="110" x2="294" y2="134" stroke="#d97706" stroke-width="2.4"/>
  <line x1="303" y1="110" x2="303" y2="134" stroke="#d97706" stroke-width="2.4"/>
  <text x="299" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">C2</text>
  <line x1="303" y1="122" x2="362" y2="122" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="362" cy="122" r="3" fill="#0f172a"/>

  <!-- Op-Amp Triangle -->
  <polygon points="215,160 215,244 300,202" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
  <text x="228" y="187" font-size="14" font-weight="700" fill="#0f172a">-</text>
  <text x="228" y="226" font-size="13" font-weight="700" fill="#0f172a">+</text>
  <line x1="175" y1="222" x2="215" y2="222" stroke="#0f172a" stroke-width="1.8"/>
  <text x="169" y="226" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Vref</text>

  <!-- Op-Amp Output Vea -->
  <line x1="300" y1="202" x2="395" y2="202" stroke="#0f172a" stroke-width="2"/>
  <circle cx="362" cy="202" r="3.5" fill="#0f172a"/>
  <circle cx="395" cy="202" r="4" fill="#dc2626"/>
  <text x="395" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">Vea</text>

  <!-- K-Factor Summary Box -->
  <rect x="24" y="262" width="380" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="283" font-size="11" font-weight="700" fill="#0f172a">Venable K 因子闭式解 (ωz1=ωz2=ωc/√K, ωp1=ωp2=ωc√K)：</text>
  <text x="36" y="303" font-size="10.8" fill="#334155">C1 = Ap/(ωc·R1)  |  C2 = C1(K-1)  |  R2 = (R1/Ap)·√K/(K-1)</text>
  <text x="36" y="323" font-size="10.8" fill="#334155">R3 = R1 / (K-1)  |  C3 = (K-1) / (ωc·√K·R1)</text>

  <!-- Right Panel: Bode Plot Magnitude & Phase -->
  <text x="446" y="30" font-size="14" font-weight="700" fill="#0f172a">(b) 功率级、补偿器与闭环波特图整形</text>

  <!-- Top Subplot: Magnitude (dB) -->
  <line x1="478" y1="145" x2="825" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="472" y="149" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">0 dB</text>
  <line x1="478" y1="55" x2="478" y2="200" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="478" y1="200" x2="828" y2="200" stroke="#0f172a" stroke-width="1.4"/>
  <text x="454" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" transform="rotate(-90 454 128)">幅值 (dB)</text>

  <!-- Vertical frequency markers: fz=570, fc=650, fp=730 -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="570" y1="58" x2="570" y2="318"/>
    <line x1="650" y1="58" x2="650" y2="318"/>
    <line x1="730" y1="58" x2="730" y2="318"/>
  </g>

  <!-- Plant Gvd(s): flat then resonant peak around x=575 then -40dB/dec -->
  <path d="M 485 110 L 545 110 Q 565 110 572 92 Q 580 112 605 136 L 765 198" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Compensator Gc(s): -20dB/dec to fz, +20dB/dec fz->fp, -20dB/dec after fp -->
  <polyline points="485,120 570,152 730,104 818,136" fill="none" stroke="#059669" stroke-width="2.2"/>

  <!-- Open Loop Gain T(s) = Gc * Gvd: smooth -20dB/dec through (fc=650, 0dB=145) -->
  <polyline points="485,68 650,145 730,174 818,198" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="650" cy="145" r="4.5" fill="#2563eb"/>
  <text x="658" y="139" font-size="10.5" font-weight="700" fill="#1d4ed8">fc (-20dB/dec)</text>

  <!-- Legend for Mag -->
  <g font-size="10">
    <line x1="716" y1="66" x2="736" y2="66" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 2"/>
    <text x="742" y="70" fill="#475569">功率级 Gvd(s)</text>
    <line x1="716" y1="81" x2="736" y2="81" stroke="#059669" stroke-width="2.2"/>
    <text x="742" y="85" fill="#065f46">补偿器 Gc(s)</text>
    <line x1="716" y1="96" x2="736" y2="96" stroke="#2563eb" stroke-width="2.5"/>
    <text x="742" y="100" fill="#1d4ed8">开环 T(s)</text>
  </g>

  <!-- Bottom Subplot: Phase (deg) -->
  <line x1="478" y1="220" x2="478" y2="322" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="478" y1="322" x2="828" y2="322" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="478" y1="306" x2="825" y2="306" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="472" y="310" text-anchor="end" font-size="10" font-weight="700" fill="#dc2626">-180°</text>
  <text x="472" y="255" text-anchor="end" font-size="10" fill="#475569">-90°</text>
  <text x="454" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" transform="rotate(-90 454 272)">相角 (°)</text>

  <!-- Open Loop Phase T(s) boosted around fc=650 to ~ -120 deg (y=272) -->
  <path d="M 485 256 C 535 262 560 286 588 282 C 618 278 632 268 650 266 C 675 266 710 284 815 304" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="650" cy="266" r="4" fill="#2563eb"/>

  <!-- PM Double Arrow at fc=650 -->
  <line x1="650" y1="270" x2="650" y2="303" stroke="#059669" stroke-width="2"/>
  <polygon points="650,268 646,275 654,275" fill="#059669"/>
  <polygon points="650,305 646,298 654,298" fill="#059669"/>
  <text x="660" y="292" font-size="11" font-weight="700" fill="#059669">PM ≈ 55°~65°</text>

  <!-- Freq Labels -->
  <text x="570" y="338" text-anchor="middle" font-size="10.5" fill="#334155">fz1, fz2</text>
  <text x="650" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">fc</text>
  <text x="730" y="338" text-anchor="middle" font-size="10.5" fill="#334155">fp1, fp2</text>
  <text x="815" y="338" text-anchor="middle" font-size="10.5" fill="#475569">log f</text>
</svg>
