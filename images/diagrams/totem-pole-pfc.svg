<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <rect x="1" y="1" width="858" height="358" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Totem-Pole PFC Topology -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#0f172a">(a) 图腾柱无桥 PFC 拓扑架构 (GaN/SiC + Si)</text>
  <line x1="435" y1="20" x2="435" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- AC Input Source -->
  <circle cx="58" cy="180" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <path d="M 48 180 Q 53 169 58 180 T 68 180" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="58" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">v_ac(t)</text>

  <!-- Boost Inductor L -->
  <line x1="58" y1="158" x2="58" y2="145" stroke="#0f172a" stroke-width="2"/>
  <line x1="58" y1="145" x2="90" y2="145" stroke="#0f172a" stroke-width="2"/>
  <path d="M 90 145 C 90 130 103 130 103 145 C 103 130 116 130 116 145 C 116 130 129 130 129 145 C 129 130 142 130 142 145" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="116" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">L_boost</text>
  <line x1="142" y1="145" x2="196" y2="145" stroke="#0f172a" stroke-width="2"/>

  <!-- Neutral Line to Slow Leg -->
  <line x1="58" y1="202" x2="58" y2="215" stroke="#0f172a" stroke-width="2"/>
  <line x1="58" y1="215" x2="286" y2="215" stroke="#0f172a" stroke-width="2"/>

  <!-- DC Bus Rails -->
  <line x1="196" y1="74" x2="405" y2="74" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="196" y1="286" x2="405" y2="286" stroke="#2563eb" stroke-width="2.2"/>
  <text x="405" y="66" text-anchor="end" font-size="11.5" font-weight="700" fill="#dc2626">+Vbus (400V)</text>
  <text x="405" y="303" text-anchor="end" font-size="11.5" font-weight="700" fill="#2563eb">PGND</text>

  <!-- Fast Leg (GaN / SiC) -->
  <line x1="196" y1="74" x2="196" y2="96" stroke="#0f172a" stroke-width="2"/>
  <rect x="172" y="96" width="48" height="36" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="196" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">S1</text>
  <line x1="196" y1="132" x2="196" y2="228" stroke="#0f172a" stroke-width="2"/>
  <circle cx="196" cy="145" r="3.5" fill="#0f172a"/>
  <rect x="172" y="228" width="48" height="36" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="196" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">S2</text>
  <line x1="196" y1="264" x2="196" y2="286" stroke="#0f172a" stroke-width="2"/>
  <text x="196" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">高频臂 (GaN/SiC)</text>

  <!-- Slow Leg (Si MOSFET 50Hz) -->
  <line x1="286" y1="74" x2="286" y2="96" stroke="#0f172a" stroke-width="2"/>
  <rect x="262" y="96" width="48" height="36" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="286" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">SL</text>
  <line x1="286" y1="132" x2="286" y2="228" stroke="#0f172a" stroke-width="2"/>
  <circle cx="286" cy="215" r="3.5" fill="#0f172a"/>
  <rect x="262" y="228" width="48" height="36" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="286" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">SN</text>
  <line x1="286" y1="264" x2="286" y2="286" stroke="#0f172a" stroke-width="2"/>
  <text x="286" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">工频臂 (50Hz Si)</text>

  <!-- Bulk Cap Cbus & Load -->
  <line x1="354" y1="74" x2="354" y2="168" stroke="#0f172a" stroke-width="2"/>
  <line x1="338" y1="168" x2="370" y2="168" stroke="#0f172a" stroke-width="2.6"/>
  <line x1="338" y1="178" x2="370" y2="178" stroke="#0f172a" stroke-width="2.6"/>
  <line x1="354" y1="178" x2="354" y2="286" stroke="#0f172a" stroke-width="2"/>
  <text x="354" y="158" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">C_bus</text>

  <line x1="400" y1="74" x2="400" y2="148" stroke="#0f172a" stroke-width="2"/>
  <rect x="389" y="148" width="22" height="58" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="400" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Ro</text>
  <line x1="400" y1="206" x2="400" y2="286" stroke="#0f172a" stroke-width="2"/>

  <rect x="26" y="314" width="388" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="333" text-anchor="middle" font-size="11" fill="#334155">GaN 零 Qrr 消除 CCM 换流直通，免去整流桥两颗二极管导通压降</text>

  <!-- Right Panel: Dual-Loop Control with 1/Vff^2 Feedforward -->
  <text x="456" y="30" font-size="14" font-weight="700" fill="#0f172a">(b) 双闭环平均电流控制与 1/Vff² 前馈解耦</text>

  <!-- Voltage Outer Loop -->
  <circle cx="484" cy="112" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="484" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Σ</text>
  <text x="462" y="96" font-size="10.5" fill="#0f172a">Vref</text>
  <text x="466" y="138" font-size="10.5" fill="#dc2626">-Vbus</text>

  <line x1="498" y1="112" x2="520" y2="112" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="520" y="88" width="96" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="568" y="109" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">电压外环 Gv</text>
  <text x="568" y="126" text-anchor="middle" font-size="10" fill="#3b82f6">fc ≈ 10~15Hz</text>

  <!-- Multiplier Box -->
  <line x1="616" y1="112" x2="648" y2="112" stroke="#0f172a" stroke-width="1.8"/>
  <text x="632" y="104" text-anchor="middle" font-size="10.5" fill="#334155">Vea</text>
  <rect x="648" y="82" width="106" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="701" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">前馈乘法器</text>
  <text x="701" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">km·|vac|·Vea / Vff²</text>

  <!-- Inputs to Multiplier -->
  <line x1="680" y1="176" x2="680" y2="142" stroke="#059669" stroke-width="1.8"/>
  <polygon points="680,142 676,149 684,149" fill="#059669"/>
  <text x="668" y="191" text-anchor="middle" font-size="10.5" font-weight="600" fill="#059669">|v_ac(t)|</text>

  <line x1="726" y1="176" x2="726" y2="142" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="726,142 722,149 730,149" fill="#dc2626"/>
  <text x="734" y="191" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dc2626">1 / Vff² (RMS前馈)</text>

  <!-- Current Inner Loop -->
  <line x1="754" y1="112" x2="788" y2="112" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="788" y1="112" x2="788" y2="232" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="788" y1="232" x2="758" y2="232" stroke="#0f172a" stroke-width="1.8"/>
  <polygon points="755,232 762,228 762,236" fill="#0f172a"/>
  <text x="802" y="176" font-size="11" font-weight="700" fill="#0f172a">i_ref</text>

  <circle cx="741" cy="232" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="741" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Σ</text>
  <text x="741" y="264" text-anchor="middle" font-size="10.5" fill="#dc2626">-i_L(t)</text>

  <line x1="727" y1="232" x2="692" y2="232" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="588" y="208" width="104" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="640" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">电流内环 Gi</text>
  <text x="640" y="246" text-anchor="middle" font-size="10" fill="#059669">fc ≈ 5~10kHz</text>

  <line x1="588" y1="232" x2="554" y2="232" stroke="#0f172a" stroke-width="1.8"/>
  <polygon points="554,232 561,228 561,236" fill="#0f172a"/>
  <rect x="466" y="208" width="88" height="48" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="510" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">PWM 发波</text>
  <text x="510" y="246" text-anchor="middle" font-size="10" fill="#475569">驱动 S1 / S2</text>

  <!-- Key takeaways box -->
  <rect x="456" y="280" width="382" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="468" y="301" font-size="11" fill="#334155">1. 外环带宽压低至 10~15Hz，衰减 100Hz 母线纹波，防 3 次谐波畸变</text>
  <text x="468" y="321" font-size="11" fill="#334155">2. 1/Vff² 抵消输入电压平方项，85~264Vac 全范围环路增益恒定</text>
</svg>
