<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <rect x="1" y="1" width="858" height="358" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: TO-247-3L vs TO-247-4L Kelvin Source Decoupling -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#0f172a">(a) 共源电感 Lss 负反馈 vs 四引脚开尔文源极解耦</text>
  <line x1="436" y1="20" x2="436" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Box: 3-Pin Shared Source -->
  <rect x="24" y="50" width="394" height="132" rx="8" fill="#fef2f2" fill-opacity="0.45" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="38" y="70" font-size="11.5" font-weight="700" fill="#b91c1c">1. 传统三引脚 (TO-247-3L)：驱动与功率回路共享 Lss</text>

  <rect x="42" y="92" width="66" height="46" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <text x="75" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">驱动器</text>
  <text x="75" y="128" text-anchor="middle" font-size="9.5" fill="#475569">Vdrv</text>

  <line x1="108" y1="104" x2="146" y2="104" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="146" y="95" width="44" height="18" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="168" y="108" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Rg+Lg</text>
  <line x1="190" y1="104" x2="236" y2="104" stroke="#0f172a" stroke-width="1.8"/>

  <rect x="236" y="84" width="66" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="269" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">SiC 管芯</text>
  <text x="269" y="120" text-anchor="middle" font-size="9.5" fill="#3b82f6">v_gs,die</text>

  <!-- Shared Lss in Source leg -->
  <line x1="269" y1="128" x2="269" y2="136" stroke="#dc2626" stroke-width="2"/>
  <path d="M 269 136 C 281 136 281 145 269 145 C 281 145 281 154 269 154 C 281 154 281 163 269 163" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="269" y1="163" x2="269" y2="170" stroke="#dc2626" stroke-width="2"/>
  <line x1="75" y1="138" x2="75" y2="170" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="75" y1="170" x2="368" y2="170" stroke="#0f172a" stroke-width="2"/>
  <text x="288" y="154" font-size="10.5" font-weight="700" fill="#dc2626">Lss (7~12nH)</text>
  <text x="315" y="105" font-size="10" font-weight="700" fill="#dc2626">di_d/dt 感应反压</text>
  <text x="315" y="120" font-size="10" fill="#991b1b">-Lss·(di_d/dt)</text>

  <!-- Bottom Box: 4-Pin Kelvin Source -->
  <rect x="24" y="198" width="394" height="142" rx="8" fill="#f0fdf4" fill-opacity="0.55" stroke="#86efac" stroke-width="1.4"/>
  <text x="38" y="218" font-size="11.5" font-weight="700" fill="#065f46">2. 四引脚开尔文源极 (TO-247-4L)：控制与功率回路解耦</text>

  <rect x="42" y="240" width="66" height="46" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <text x="75" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">驱动器</text>
  <text x="75" y="276" text-anchor="middle" font-size="9.5" fill="#475569">Vdrv</text>

  <line x1="108" y1="252" x2="146" y2="252" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="146" y="243" width="44" height="18" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="168" y="256" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Rg+Lg</text>
  <line x1="190" y1="252" x2="236" y2="252" stroke="#0f172a" stroke-width="1.8"/>

  <rect x="236" y="232" width="66" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="269" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">SiC 管芯</text>
  <text x="269" y="268" text-anchor="middle" font-size="9.5" fill="#3b82f6">v_gs,die</text>

  <!-- Kelvin Source Return (Green - independent directly from die) -->
  <line x1="252" y1="276" x2="252" y2="300" stroke="#059669" stroke-width="2.2"/>
  <line x1="252" y1="300" x2="75" y2="300" stroke="#059669" stroke-width="2.2"/>
  <line x1="75" y1="286" x2="75" y2="300" stroke="#059669" stroke-width="2.2"/>
  <text x="164" y="295" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Pin 4: Kelvin Source (仅流过 i_g)</text>

  <!-- Power Source Return (Separate) -->
  <line x1="286" y1="276" x2="286" y2="326" stroke="#475569" stroke-width="2.2"/>
  <line x1="286" y1="326" x2="390" y2="326" stroke="#475569" stroke-width="2.2"/>
  <text x="338" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Pin 3: 功率源极 (i_d)</text>
  <text x="314" y="256" font-size="10" font-weight="700" fill="#059669">无 Lss·di/dt 干扰</text>
  <text x="314" y="272" font-size="10" fill="#047857">开关损耗降 40~60%</text>

  <!-- Right Panel: Gate RLC Step Response Curves -->
  <text x="456" y="30" font-size="14" font-weight="700" fill="#0f172a">(b) 栅极 RLC 二阶阶跃响应与过冲边界</text>

  <!-- Grid & Axes -->
  <line x1="504" y1="296" x2="834" y2="296" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="504" y1="296" x2="504" y2="56" stroke="#0f172a" stroke-width="1.8"/>
  <polygon points="834,296 826,292 826,300" fill="#0f172a"/>
  <polygon points="504,56 500,64 508,64" fill="#0f172a"/>
  <text x="470" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a" transform="rotate(-90 470 176)">栅源电压 Vgs (V)</text>

  <!-- Reference Voltage Lines: +18V (y=142), +22V max rating (y=102), 0V (y=296) -->
  <rect x="505" y="62" width="322" height="40" fill="#fef2f2" opacity="0.85"/>
  <line x1="504" y1="102" x2="828" y2="102" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="499" y="106" text-anchor="end" font-size="10" font-weight="700" fill="#dc2626">+22V</text>
  <text x="822" y="96" text-anchor="end" font-size="10.5" font-weight="700" fill="#b91c1c">SiC 栅氧耐压红线 (Vgs,max)</text>

  <line x1="504" y1="142" x2="828" y2="142" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="499" y="146" text-anchor="end" font-size="10" font-weight="700" fill="#334155">+18V</text>
  <text x="499" y="299" text-anchor="end" font-size="10" fill="#475569">0V</text>

  <!-- Underdamped zeta = 0.31 (Overshoot to +24.4V -> y=78) -->
  <path d="M 504 296 C 525 220 546 110 568 78 C 584 56 604 176 626 172 C 646 168 660 124 682 132 C 704 140 726 146 756 142 L 826 142" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="569" cy="77" r="4" fill="#dc2626"/>
  <text x="580" y="75" font-size="10" font-weight="700" fill="#dc2626">+24.4V 击穿风险</text>

  <!-- Optimal damped zeta = 0.75 (slight ~3% overshoot to ~18.5V -> y=137) -->
  <path d="M 504 296 C 534 228 564 152 606 137 C 632 130 662 142 710 142 L 826 142" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Critically damped zeta = 1.0 (smooth monotonic approach) -->
  <path d="M 504 296 C 546 238 594 166 668 147 C 710 142 755 142 826 142" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 3"/>

  <!-- Legend -->
  <rect x="640" y="182" width="184" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="650" y1="199" x2="672" y2="199" stroke="#dc2626" stroke-width="2.4"/>
  <text x="678" y="203" font-size="10.5" fill="#334155">ζ = 0.31 (严重欠阻尼)</text>
  <line x1="650" y1="219" x2="672" y2="219" stroke="#2563eb" stroke-width="2.5"/>
  <text x="678" y="223" font-size="10.5" fill="#334155">ζ = 0.75 (工程推荐)</text>
  <line x1="650" y1="239" x2="672" y2="239" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 2"/>
  <text x="678" y="243" font-size="10.5" fill="#334155">ζ = 1.00 (临界无过冲)</text>

  <text x="668" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">时间 t (ns)</text>
</svg>
